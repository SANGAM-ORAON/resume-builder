<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Resume Builder | Sangam Oraon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="form">
    <h2>Resume Builder</h2>

    <input id="name" placeholder="Full Name">
    <input id="title" placeholder="Job Title (e.g. Frontend Developer)">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone">
    <input id="location" placeholder="Location">

    <textarea id="summary" placeholder="Professional Summary (2 - 3 lines)"></textarea>

    <textarea id="skills" placeholder="Skills (comma separated)"></textarea>

    <textarea id="experience" placeholder="Experience (comma separated)"></textarea>

    <textarea id="education" placeholder="Education (comma separated)"></textarea>

    <button onclick="generateResume()">Generate</button>
    <button onclick="saveData()">Save</button>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>

  <!-- RESUME -->
  <div class="resume" id="resume">
    <h1 id="r-name">Your Name</h1>
    <p class="title" id="r-title"></p>
    <p class="contact" id="r-contact"></p>

    <section>
      <h3>Professional Summary</h3>
      <p id="r-summary"></p>
    </section>

    <section>
      <h3>Skills</h3>
      <ul id="r-skills"></ul>
    </section>
    
    <section>
      <h3>Professional Experience</h3>
      <ul id="r-experience"></ul>
    </section>
    
    <section>
      <h3>Education</h3>
      <ul id="r-education"></ul>
    </section>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
